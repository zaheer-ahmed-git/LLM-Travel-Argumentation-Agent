services:
  postgres:
    image: postgres:16-alpine
    container_name: workflow_automation_db
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow_automation
    ports:
      - "5432:5432"
    volumes:
      - workflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workflow_pg_data:
